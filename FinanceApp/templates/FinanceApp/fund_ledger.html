{% extends 'FinanceApp/base.html' %}

{% block title %}Fund Ledger{% endblock %}

{% block content %}

<div class="app-header">
    📒 Fund Ledger
</div>

<input
    type="text"
    id="search"
    class="form-control mb-3"
    placeholder="Search fund source..."
>

<table class="table table-hover">

    <thead>

        <tr>
            <th>Fund Source</th>
            <th class="text-end">Outstanding</th>
            <th></th>
        </tr>

    </thead>

    <tbody id="ledgerTable">

    {% for fund in fund_sources %}

        <tr>

            <td>
                {{ fund.name }}
            </td>

            <td class="text-end">

                ₹{{ fund.outstanding|floatformat:2 }}

            </td>

            <td class="text-end">

                <a
                    href="{% url 'fund_ledger_detail' fund.id %}"
                    class="btn btn-primary btn-sm"
                >
                    View Ledger
                </a>

            </td>

        </tr>

    {% empty %}

        <tr>

            <td colspan="3">

                No fund sources found.

            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

<script>

document.getElementById("search").addEventListener("keyup", function(){

    const value = this.value.toLowerCase();

    const rows = document.querySelectorAll("#ledgerTable tr");

    rows.forEach(function(row){

        row.style.display =
            row.innerText.toLowerCase().includes(value)
            ? ""
            : "none";

    });

});

</script>

{% endblock %}
